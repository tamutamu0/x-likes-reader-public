name: Margin
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
packages:
  MarginCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  Margin:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MarginCore
    info:
      path: .generated/Info.plist
      properties:
        CFBundleDisplayName: margin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.margin
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  Margin:
    build:
      targets:
        Margin: all
    run:
      config: Debug
